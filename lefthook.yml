pre-commit:
  parallel: true
  commands:
    uv-sort:
      glob: "pyproject.toml"
      run: uvx uv-sort
      stage_fixed: true
    # One command, not two: `check --fix` and `format` both rewrite the whole
    # file, so as separate parallel commands they race and the loser's fixes
    # are silently dropped. Lint first -- formatting its output is stable,
    # fixing formatted output is not.
    ruff:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true
  exclude_tags:
    - merge
    - rebase

commit-msg:
  commands:
    conventional-commits:
      run: |
        CONVENTIONAL_COMMIT_PATTERN="^(new|fix|docs|style|ref|perf|test|chore|build|ci|revert)(\(.+\))?:"
        commit_message=$(cat {1})
        if ! echo "$commit_message" | grep -qE "$CONVENTIONAL_COMMIT_PATTERN"; then
          echo "Commit message must follow conventional commits format:"
          echo "type(scope): description"
          echo "Types: new, fix, docs, style, ref, perf, test, chore, build, ci, revert"
          exit 1
        fi
