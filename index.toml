# The book's index, which pw-book's template/book-index.typ prints and sorts, so
# the order of terms doesn't matter, except that a top-level term must stay above
# the first [table]: below it, TOML makes the term a sub-entry. Each term maps to
# one of:
#   - a list of the sections that teach it, by the label the book gives a heading,
#     printed as the page each section starts on;
#   - a table of sub-entries, each mapping to such a list;
#   - a string, another term, which prints as "see" that term.
# A label is doc:<topic>:<doc>:<heading> for <topic>/_docs/<doc>.md, or
# appendix:<doc>:<heading>, the heading as GitHub anchors it; getting-started and
# the book's other pages of its own have labels of their own. Backticks set code
# in the code font. scripts/check_order.py finds where each term is first taught
# here, and fails on a label whose heading was renamed, as the book's build does.

