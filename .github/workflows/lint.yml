name: Lint

# Style gate for every branch and pull request. Locally the same checks run as
# lefthook pre-commit hooks; this catches commits that bypassed them.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true

      # Ruff's version is pinned in pyproject.toml, so CI, the lefthook hooks
      # and a local `uv run` all lint with the same one, and a new ruff release
      # cannot turn CI red on its own.
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
