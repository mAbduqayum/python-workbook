name: Lint

# Style gate for the curriculum itself, not for the people learning from it: a
# beginner's first loop failing ruff is discouraging noise, and `Grade
# Calculator` is the feedback that actually means something to them. So this
# runs on `solutions` only — never on `main`, which students work from, and
# never in their forks.
# Locally the same checks run as lefthook pre-commit hooks; this catches
# commits that bypassed them.

on:
  push:
    branches: [solutions]
  pull_request:
    branches: [solutions]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    # A student who forks and pushes to their own `solutions` is still a
    # student. Pull requests are exempt: `repository` is the base repo there,
    # so outside contributions are still linted.
    if: github.event.repository.fork == false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true

      # Ruff's version is pinned in pyproject.toml, so CI, the lefthook hooks
      # and a local `uv run` all lint with the same one, and a new ruff release
      # cannot turn CI red on its own.
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
