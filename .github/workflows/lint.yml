name: Lint

# Style gate for every branch and pull request. Locally the same checks run as
# lefthook pre-commit hooks; this catches commits that bypassed them.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true

      # Pinned so a ruff release cannot turn CI red on its own. Ruff is not a
      # project dependency, so `uvx` keeps it out of uv.lock.
      - name: Lint
        run: uvx ruff@0.15.22 check .

      - name: Check formatting
        run: uvx ruff@0.15.22 format --check .
