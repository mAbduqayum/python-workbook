name: Sync to Main

# Source of truth is the `solutions` branch. On every push to `solutions`, its
# new commits are replayed onto `main` one at a time under their own title,
# plus a `Source-commit: <sha>` trailer — the newest such trailer on `main` is
# where the next run resumes.
# A replayed commit holds the source tree except the solution scripts (see
# `is_solution_script` below) and the whole `ignore/` directory, which is
# solutions-only working space. Everything else is mirrored as-is: tests,
# `conftest.py`, Python fixture data such as `files/samples/calculator.py`, and
# all non-Python content (docs, slides, configs). Tests already `pytest.skip`
# when their solution file is absent, so deletion is the intended behaviour.

on:
  push:
    branches: [solutions]
  workflow_dispatch:

# Serialize syncs; never cancel an in-flight mirror mid-push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history of both branches

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Replay new solutions commits onto main (strip solution scripts)
        shell: bash
        run: |
          set -euo pipefail

          # An exercise is named after its directory, so its solution script is
          # exactly <topic>/<exercise>/<exercise>.py.
          is_solution_script() {
            local exercise_dir="${1%/*}"
            [ "$1" = "$exercise_dir/${exercise_dir##*/}.py" ]
          }

          git fetch origin solutions main

          # Append onto main's existing history (linear, fast-forwardable).
          git checkout -B main origin/main

          synced_through=$(git log -1 --grep='^Source-commit: ' \
            --format='%(trailers:key=Source-commit,valueonly)' origin/main)

          if [ -z "$synced_through" ] || ! git merge-base --is-ancestor "$synced_through" origin/solutions; then
            echo "::error::main has no Source-commit trailer to resume from"
            exit 1
          fi

          # Merges are skipped: the commits they merge are replayed on their
          # own. Excluding main skips whatever it already carries.
          unsynced=$(git rev-list --reverse --topo-order --no-merges origin/solutions --not "$synced_through" main)

          for source_commit in $unsynced; do
            # Index + working tree now mirror it; HEAD stays on main.
            git read-tree -u --reset "$source_commit"

            git ls-files -z -- '*.py' | while IFS= read -r -d '' file; do
              # `if`, not `&&`: a last file that is not a solution would leave
              # the loop exit 1 and pipefail would kill the run silently.
              if is_solution_script "$file"; then printf '%s\0' "$file"; fi
            done | xargs -0r git rm -q -f --
            git rm -q -r -f --ignore-unmatch -- ignore

            # Commits touching nothing but stripped files leave main as it was.
            git diff --cached --quiet HEAD && continue

            printf '%s\n\nSource-commit: %s\n' "$(git log -1 --format=%s "$source_commit")" "$source_commit" |
              git commit -q --no-verify -F -
            git log -1 --format='replayed %h %s' "$source_commit"
          done

          if [ "$(git rev-parse main)" = "$(git rev-parse origin/main)" ]; then
            echo "main already mirrors solutions; nothing to commit"
            exit 0
          fi

          git push origin main
          echo "main updated from solutions"

      - name: Report sync status
        if: always()
        run: |
          echo "Latest commits on main:"
          git log --oneline -5 main || true
